<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484"
     role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">auspex pipeline: three capture surfaces, one event model, one rule engine</title>
  <desc id="pipeDesc">Three capture surfaces feed one pipeline. Hooks and plugins are synchronous and can deny; the OTLP/HTTP receiver and the on-disk artifact scanner observe only. All three converge on one normalization stage that emits a closed event vocabulary of command.exec, file.read, file.write, file.delete, tool.call, and network.indicator, contract-validated and redacted. One detection stage evaluates 51 CEL rules in 12 categories plus 6 sequence chains, identically for every surface. Normalization and detection both write NDJSON records at schema v0.2.0. A deny response returns only along the hook path, and only when an operator opts a rule in.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="484" rx="20" fill="#0B0D0F"/>
  <rect x="0.75" y="0.75" width="1198.5" height="482.5" rx="19.25" fill="none" stroke="#1D242B"/>

  <g id="deny-return">
    <text class="mono" x="610" y="42" font-size="18" fill="#D9574F" text-anchor="middle">deny response · hook path only, opt-in per rule</text>
    <path d="M1005 96 V64 H220 V88" fill="none" stroke="#D9574F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M214 88 L226 88 L220 99 Z" fill="#D9574F"/>
  </g>

  <g id="capture">
    <rect x="60" y="102" width="320" height="76" rx="12" fill="#11151A" stroke="#2A333B"/>
    <text class="mono" x="84" y="136" font-size="22" fill="#E9EDF1">hook · plugin</text>
    <text class="mono" x="84" y="163" font-size="18" fill="#D9574F">pre-action · can deny</text>

    <rect x="60" y="194" width="320" height="76" rx="12" fill="#11151A" stroke="#222A31"/>
    <text class="mono" x="84" y="228" font-size="22" fill="#E9EDF1">collect</text>
    <text class="mono" x="84" y="255" font-size="18" fill="#79848F">OTLP/HTTP · observe</text>

    <rect x="60" y="286" width="320" height="76" rx="12" fill="#11151A" stroke="#222A31"/>
    <text class="mono" x="84" y="320" font-size="22" fill="#E9EDF1">scan</text>
    <text class="mono" x="84" y="347" font-size="18" fill="#79848F">at rest · observe</text>
  </g>

  <g id="converge" stroke="#4E5862" stroke-width="1.5" fill="none">
    <path d="M380 140 H460"/>
    <path d="M380 232 H460"/>
    <path d="M380 324 H460"/>
    <path d="M460 140 V324"/>
    <path d="M460 232 H500"/>
  </g>
  <path d="M500 226 L500 238 L512 232 Z" fill="#4E5862"/>

  <g id="normalize">
    <rect x="516" y="102" width="320" height="260" rx="14" fill="#11151A" stroke="#222A31"/>
    <text class="mono" x="540" y="140" font-size="22" fill="#E9EDF1">normalize</text>
    <line x1="540" y1="158" x2="812" y2="158" stroke="#222A31"/>
    <text class="mono" x="540" y="192" font-size="20" fill="#C7CFD7">command.exec</text>
    <text class="mono" x="540" y="222" font-size="20" fill="#C7CFD7">file.read · file.write</text>
    <text class="mono" x="540" y="252" font-size="20" fill="#C7CFD7">file.delete · tool.call</text>
    <text class="mono" x="540" y="282" font-size="20" fill="#C7CFD7">network.indicator</text>
    <text class="mono" x="540" y="320" font-size="18" fill="#79848F">contract-validated</text>
    <text class="mono" x="540" y="344" font-size="18" fill="#79848F">secrets redacted</text>
  </g>

  <g id="link2" stroke="#4E5862" stroke-width="1.5" fill="none">
    <path d="M836 232 H864"/>
  </g>
  <path d="M864 226 L864 238 L876 232 Z" fill="#4E5862"/>

  <g id="detect">
    <rect x="880" y="102" width="260" height="260" rx="14" fill="#11151A" stroke="#2A333B"/>
    <text class="mono" x="904" y="140" font-size="22" fill="#E9EDF1">detect</text>
    <line x1="904" y1="158" x2="1116" y2="158" stroke="#222A31"/>
    <text class="mono" x="904" y="192" font-size="20" fill="#E3A84C">51 CEL rules</text>
    <text class="mono" x="904" y="222" font-size="20" fill="#C7CFD7">12 categories</text>
    <text class="mono" x="904" y="252" font-size="20" fill="#C7CFD7">6 sequence chains</text>
    <text class="mono" x="904" y="320" font-size="18" fill="#79848F">one engine for</text>
    <text class="mono" x="904" y="344" font-size="18" fill="#79848F">every surface</text>
  </g>

  <g id="emit" stroke="#4E5862" stroke-width="1.5" fill="none">
    <path d="M676 362 V396"/>
    <path d="M1010 362 V396"/>
  </g>
  <path d="M670 396 L682 396 L676 408 Z" fill="#4E5862"/>
  <path d="M1004 396 L1016 396 L1010 408 Z" fill="#4E5862"/>

  <rect x="60" y="410" width="1080" height="56" rx="12" fill="#0F1418" stroke="#2A333B"/>
  <text class="mono" x="88" y="445" font-size="20" fill="#E9EDF1">NDJSON records, schema v0.2.0</text>
  <text class="mono" x="452" y="445" font-size="20" fill="#79848F">event · finding · indicator · enforcement · diagnostic</text>
</svg>
